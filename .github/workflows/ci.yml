name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          REVERSIO_PYTHON: python
          REVERSIO_MYPY: mypy
      - run: npm run build
